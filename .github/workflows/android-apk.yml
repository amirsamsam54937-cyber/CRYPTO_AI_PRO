name: Build AMIR ARSALAN TRADER WOLF 2.17 Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "tools/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real-data collection and neural training dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn pytest ccxt
      - name: Test chronological training split
        run: PYTHONPATH=. pytest -q tests/test_wolf_training.py
      - name: Collect exactly 500,000 real closed futures candles
        run: python tools/build_real_market_seed.py
      - name: Train ten deep neural networks on collected real candles
        run: python tools/train_wolf_ensemble.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APK
        run: gradle assembleDebug
      - name: Verify APK database, size and trained ensemble
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          MIN=$((20 * 1024 * 1024))
          if [ "$SIZE" -lt "$MIN" ]; then
            echo "APK is only $SIZE bytes; the 20 MiB real-content target was not met."
            exit 1
          fi
          unzip -l "$APK" | grep -q "assets/market_seed.csv"
          unzip -l "$APK" | grep -q "assets/wolf_pretrained_ensemble.json"
          python - <<'PY'
          import csv, json, os
          with open("market_seed_manifest.json", encoding="utf-8") as f:
              m=json.load(f)
          assert m["rows"] == 500000 and m["synthetic_rows"] == 0
          with open("app/src/main/assets/market_seed.csv", newline="", encoding="utf-8") as f:
              assert sum(1 for _ in csv.reader(f)) == 500001
          with open("wolf_model_training_report.json", encoding="utf-8") as f:
              model=json.load(f)
          assert model["samples"] >= 500
          assert len(model["metrics"]) == 10
          print("Verified real candle rows:",m["rows"])
          print("Neural training samples:",model["samples"])
          print("APK bytes:",os.path.getsize("app/build/outputs/apk/debug/app-debug.apk"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AMIR-ARSALAN-TRADER-WOLF-v2.17.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            market_seed_manifest.json
            wolf_model_training_report.json
          if-no-files-found: error
          retention-days: 30
