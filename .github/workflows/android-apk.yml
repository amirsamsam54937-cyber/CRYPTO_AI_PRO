name: Build AMIR ARSALAN TRADER WOLF Android APK
permissions:
  actions: write
  contents: read
concurrency:
  group: wolf-android-build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "app/**"
      - "tools/**"
      - "knowledge/**"
      - "docs/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable Android APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: AMIR-ARSALAN-TRADER-WOLF-2.24.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
