name: Build AMIR ARSALAN TRADER WOLF 2.23 Android APK
permissions:
  actions: write
  contents: read
concurrency:
  group: wolf-android-build-${{ github.run_id }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "app/**"
      - "tools/**"
      - "knowledge/**"
      - "docs/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: AMIR-ARSALAN-TRADER-WOLF-v2.18.0
          path: pretrained-bundle
          run-id: 42365667977
          github-token: ${{ github.token }}
      - name: Reuse previously verified real-data corpus and ten-network ensemble
        shell: bash
        run: |
          set -euo pipefail
          OLD_APK="pretrained-bundle/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$OLD_APK"
          mkdir -p app/src/main/assets
          unzip -p "$OLD_APK" assets/market_seed.csv > app/src/main/assets/market_seed.csv
          unzip -p "$OLD_APK" assets/wolf_pretrained_ensemble.json > app/src/main/assets/wolf_pretrained_ensemble.json
          cp pretrained-bundle/market_seed_manifest.json market_seed_manifest.json
          cp pretrained-bundle/wolf_model_training_report.json wolf_model_training_report.json
          test -s app/src/main/assets/market_seed.csv
          test -s app/src/main/assets/wolf_pretrained_ensemble.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APK
        run: gradle assembleDebug
      - name: Verify real data, ten trained networks and 20 MiB APK target
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          MIN=$((20 * 1024 * 1024))
          if [ "$SIZE" -lt "$MIN" ]; then
            echo "APK is only $SIZE bytes; the 20 MiB real-content target was not met."
            exit 1
          fi
          unzip -l "$APK" | grep -q "assets/market_seed.csv"
          unzip -l "$APK" | grep -q "assets/wolf_pretrained_ensemble.json"
          unzip -l "$APK" | grep -q "wolf_poster.jpg"
          python - <<'PY'
          import csv, json, os
          with open("market_seed_manifest.json", encoding="utf-8") as f:
              manifest=json.load(f)
          assert manifest["status"] == "verified_real_exchange_data"
          assert 150000 <= manifest["rows"] <= 500000
          assert manifest["synthetic_rows"] == 0
          assert manifest["source_exchanges"]
          with open("app/src/main/assets/market_seed.csv", newline="", encoding="utf-8") as f:
              assert sum(1 for _ in csv.reader(f)) == manifest["rows"] + 1
          with open("wolf_model_training_report.json", encoding="utf-8") as f:
              model=json.load(f)
          assert model["samples"] >= 500
          assert len(model["metrics"]) == 10
          assert model["evaluation"]["split"] == "chronological_purged"
          print("Verified real candle rows:", manifest["rows"])
          print("Verified symbols:", manifest["symbols"])
          print("Source exchanges:", manifest["source_exchanges"])
          print("Neural training samples:", model["samples"])
          print("APK bytes:", os.path.getsize("app/build/outputs/apk/debug/app-debug.apk"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AMIR-ARSALAN-TRADER-WOLF-v2.23.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            market_seed_manifest.json
            wolf_model_training_report.json
          if-no-files-found: error
          retention-days: 30
