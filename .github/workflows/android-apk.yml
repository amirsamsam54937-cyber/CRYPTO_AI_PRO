name: Build AMIR ARSALAN TRADER WOLF 2.16 Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "tools/train_wolf_ensemble.py"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research test dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn pytest
      - name: Test chronological training split
        run: PYTHONPATH=. pytest -q tests/test_wolf_training.py
      - name: Train ten neural networks when canonical Binance data is available
        run: |
          set +e
          python tools/train_wolf_ensemble.py 2>&1 | tee wolf_training.log
          train_status=${PIPESTATUS[0]}
          set -e
          if [ "$train_status" -ne 0 ]; then
            if grep -q "HTTP Error 451" wolf_training.log && grep -q "No real historical data received" wolf_training.log; then
              echo "::warning::Binance returned HTTP 451. Respecting the denial; packaging the analysis app without fabricated or mirror-trained neural weights."
              printf '%s\n' '{"status":"not_trained","validatedForScoring":false,"reason":"Canonical Binance public endpoint returned HTTP 451; no alternate host or mirror was used."}' > wolf_model_training_report.json
            else
              exit "$train_status"
            fi
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AMIR-ARSALAN-TRADER-WOLF-v2.16.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            wolf_model_training_report.json
          if-no-files-found: error
          retention-days: 30
