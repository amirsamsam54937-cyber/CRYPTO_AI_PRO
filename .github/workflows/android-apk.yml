name: Build ZORO APK
permissions:
  contents: read
  actions: read
concurrency:
  group: hope-hunter-apk-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      train_models:
        description: "Build and train the verified XT historical corpus (slow; optional)"
        required: false
        default: false
        type: boolean
      require_trained_bundle:
        description: "Fail the release build unless the verified corpus and ten validated models are packaged"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "app/**"
      - "tools/**"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/wolf-deep-learning.yml"
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Python for XT-only historical data and model training
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.train_models) || (github.event_name == 'push' && (github.ref == 'refs/heads/zoro-gen2-neural-calibration' || github.ref == 'refs/heads/zoro-gen3-walkforward-research' || github.ref == 'refs/heads/zoro-gen3-refinement' || github.ref == 'refs/heads/zoro-gen4-validation' || github.ref == 'refs/heads/zoro-gen4-validation-audit' || github.ref == 'refs/heads/zoro-gen4-holdout-hardening' || github.ref == 'refs/heads/zoro-gen4-signal-consensus' || github.ref == 'refs/heads/zoro-gen4-crypto-identity' || github.ref == 'refs/heads/zoro-gen4-neural-probability-labels' || github.ref == 'refs/heads/zoro-gen5-training-efficiency' || github.ref == 'refs/heads/zoro-gen6-dynamic-autopilot' || github.ref == 'refs/heads/zoro-gen7-risk-correlation-guards' || github.ref == 'refs/heads/zoro-gen8-execution-integrity' || github.ref == 'refs/heads/zoro-gen9-candle-integrity' || github.ref == 'refs/heads/zoro-gen14-cognitive-market-engine' || github.ref == 'refs/heads/zoro-gen15-adaptive-consensus' || github.ref == 'refs/heads/zoro-gen16-triple-barrier-labels' || github.ref == 'refs/heads/zoro-gen17-wilder-indicators' || github.ref == 'refs/heads/zoro-gen18-regime-specialist-audit' || github.ref == 'refs/heads/zoro-gen19-regime-calibration')) }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build 898,920 real XT USDT-M candles
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.train_models) || (github.event_name == 'push' && (github.ref == 'refs/heads/zoro-gen2-neural-calibration' || github.ref == 'refs/heads/zoro-gen3-walkforward-research' || github.ref == 'refs/heads/zoro-gen3-refinement' || github.ref == 'refs/heads/zoro-gen4-validation' || github.ref == 'refs/heads/zoro-gen4-validation-audit' || github.ref == 'refs/heads/zoro-gen4-holdout-hardening' || github.ref == 'refs/heads/zoro-gen4-signal-consensus' || github.ref == 'refs/heads/zoro-gen4-crypto-identity' || github.ref == 'refs/heads/zoro-gen4-neural-probability-labels' || github.ref == 'refs/heads/zoro-gen5-training-efficiency' || github.ref == 'refs/heads/zoro-gen6-dynamic-autopilot' || github.ref == 'refs/heads/zoro-gen7-risk-correlation-guards' || github.ref == 'refs/heads/zoro-gen8-execution-integrity' || github.ref == 'refs/heads/zoro-gen9-candle-integrity' || github.ref == 'refs/heads/zoro-gen14-cognitive-market-engine' || github.ref == 'refs/heads/zoro-gen15-adaptive-consensus' || github.ref == 'refs/heads/zoro-gen16-triple-barrier-labels' || github.ref == 'refs/heads/zoro-gen17-wilder-indicators' || github.ref == 'refs/heads/zoro-gen18-regime-specialist-audit' || github.ref == 'refs/heads/zoro-gen19-regime-calibration')) }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip ccxt numpy scikit-learn
          python tools/build_real_market_seed.py
          cp market_seed_manifest.json app/src/main/assets/wolf_corpus_manifest.json
      - name: Verify XT-only corpus provenance and row count
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.train_models) || (github.event_name == 'push' && (github.ref == 'refs/heads/zoro-gen2-neural-calibration' || github.ref == 'refs/heads/zoro-gen3-walkforward-research' || github.ref == 'refs/heads/zoro-gen3-refinement' || github.ref == 'refs/heads/zoro-gen4-validation' || github.ref == 'refs/heads/zoro-gen4-validation-audit' || github.ref == 'refs/heads/zoro-gen4-holdout-hardening' || github.ref == 'refs/heads/zoro-gen4-signal-consensus' || github.ref == 'refs/heads/zoro-gen4-crypto-identity' || github.ref == 'refs/heads/zoro-gen4-neural-probability-labels' || github.ref == 'refs/heads/zoro-gen5-training-efficiency' || github.ref == 'refs/heads/zoro-gen6-dynamic-autopilot' || github.ref == 'refs/heads/zoro-gen7-risk-correlation-guards' || github.ref == 'refs/heads/zoro-gen8-execution-integrity' || github.ref == 'refs/heads/zoro-gen9-candle-integrity' || github.ref == 'refs/heads/zoro-gen14-cognitive-market-engine' || github.ref == 'refs/heads/zoro-gen15-adaptive-consensus' || github.ref == 'refs/heads/zoro-gen16-triple-barrier-labels' || github.ref == 'refs/heads/zoro-gen17-wilder-indicators' || github.ref == 'refs/heads/zoro-gen18-regime-specialist-audit' || github.ref == 'refs/heads/zoro-gen19-regime-calibration')) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, pathlib
          assets=pathlib.Path("app/src/main/assets")
          m=json.loads((assets/"wolf_corpus_manifest.json").read_text())
          assert m["status"] == "verified_real_exchange_data"
          assert m["data_source_policy"] == "XT_USDT_M_CRYPTO_ONLY"
          assert m["source_exchanges"] == ["XT"]
          assert m["crypto_only_verified"] is True
          assert m["currency_universe_source"] == "XT_SPOT_PUBLIC_SUPPORTED_CURRENCIES+COINGECKO_PUBLIC_COINS_LIST"
          assert m["xt_crypto_type_currency_count"] >= 1
          assert m["asset_class_policy"] == "XT_SPOT_CRYPTO_AND_COINGECKO_IDENTITY_MATCH"
          assert m["crypto_asset_registry_source"] == "COINGECKO_PUBLIC_COINS_LIST"
          assert len(m["crypto_asset_registry_sha256"]) == 64
          assert m["rows"] >= 898_920 and m["synthetic_rows"] == 0
          with (assets/"market_seed.csv").open(newline="") as f:
              reader=csv.DictReader(f)
              rows=0
              for row in reader:
                  assert row["exchange"].upper() == "XT"
                  rows += 1
          assert rows == m["rows"], (rows,m["rows"])
          print(f"Verified {rows:,} real XT USDT-M candles; no mixed-exchange or synthetic rows")
          PY
      - name: Train ten neural networks on verified real futures history
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.train_models) || (github.event_name == 'push' && (github.ref == 'refs/heads/zoro-gen2-neural-calibration' || github.ref == 'refs/heads/zoro-gen3-walkforward-research' || github.ref == 'refs/heads/zoro-gen3-refinement' || github.ref == 'refs/heads/zoro-gen4-validation' || github.ref == 'refs/heads/zoro-gen4-validation-audit' || github.ref == 'refs/heads/zoro-gen4-holdout-hardening' || github.ref == 'refs/heads/zoro-gen4-signal-consensus' || github.ref == 'refs/heads/zoro-gen4-crypto-identity' || github.ref == 'refs/heads/zoro-gen4-neural-probability-labels' || github.ref == 'refs/heads/zoro-gen5-training-efficiency' || github.ref == 'refs/heads/zoro-gen6-dynamic-autopilot' || github.ref == 'refs/heads/zoro-gen7-risk-correlation-guards' || github.ref == 'refs/heads/zoro-gen8-execution-integrity' || github.ref == 'refs/heads/zoro-gen9-candle-integrity' || github.ref == 'refs/heads/zoro-gen14-cognitive-market-engine' || github.ref == 'refs/heads/zoro-gen15-adaptive-consensus' || github.ref == 'refs/heads/zoro-gen16-triple-barrier-labels' || github.ref == 'refs/heads/zoro-gen17-wilder-indicators' || github.ref == 'refs/heads/zoro-gen18-regime-specialist-audit' || github.ref == 'refs/heads/zoro-gen19-regime-calibration')) }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip numpy scikit-learn
          python tools/train_wolf_ensemble.py 2>&1 | tee wolf-training.log
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("app/src/main/assets/wolf_pretrained_ensemble.json")
          assert p.is_file() and p.stat().st_size > 10000, "Fresh model weights were not exported"
          d=json.loads(p.read_text())
          e=d["evaluation"]
          assert len(d["members"]) == 10, "Expected ten trained models"
          assert e["split"] == "chronological_purged", "Missing chronological purged holdout"
          assert d["test_samples"] >= 300, "Insufficient holdout samples"
          assert d["samples"] >= 10000, "Insufficient real labeled samples"
          wf=d["walk_forward"]
          cross=d["cross_symbol_holdout"]
          validated = (
              e["ensemble_balanced_accuracy"] >= 0.52
              and e["ensemble_log_loss"] < e["prevalence_baseline_log_loss"]
              and e["ensemble_accuracy"] >= e["majority_class_baseline_accuracy"]
              and e["ensemble_brier_score"] < e["prevalence_baseline_brier_score"]
              and e["ensemble_roc_auc"] >= 0.55
              and e["ensemble_expected_calibration_error"] <= 0.10
              and wf.get("status") == "evaluated"
              and wf.get("fold_count",0) >= 3
              and wf.get("mean_balanced_accuracy",0) >= 0.50
              and wf.get("mean_log_loss",999) < wf.get("mean_baseline_log_loss",0)
              and cross.get("status") == "evaluated"
              and cross.get("balanced_accuracy",0) >= 0.50
              and cross.get("log_loss",999) < cross.get("baseline_log_loss",0)
              and cross.get("roc_auc",0) >= 0.52
          )
          report={k:v for k,v in d.items() if k != "members"}
          report["validation_status"] = "validated_for_scoring" if validated else "trained_but_not_validated"
          report["validated_for_scoring"] = bool(validated)
          report_text = json.dumps(report,indent=2)
          pathlib.Path("wolf_model_training_report.json").write_text(report_text)
          pathlib.Path("app/src/main/assets/wolf_model_training_report.json").write_text(report_text)
          print(json.dumps({"trained_models":len(d["members"]),"samples":d["samples"],"validation_status":report["validation_status"],"evaluation":e},indent=2))
          PY
      - name: Compress verified XT corpus for Android assets
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.train_models) || (github.event_name == 'push' && (github.ref == 'refs/heads/zoro-gen2-neural-calibration' || github.ref == 'refs/heads/zoro-gen3-walkforward-research' || github.ref == 'refs/heads/zoro-gen3-refinement' || github.ref == 'refs/heads/zoro-gen4-validation' || github.ref == 'refs/heads/zoro-gen4-validation-audit' || github.ref == 'refs/heads/zoro-gen4-holdout-hardening' || github.ref == 'refs/heads/zoro-gen4-signal-consensus' || github.ref == 'refs/heads/zoro-gen4-crypto-identity' || github.ref == 'refs/heads/zoro-gen4-neural-probability-labels' || github.ref == 'refs/heads/zoro-gen5-training-efficiency' || github.ref == 'refs/heads/zoro-gen6-dynamic-autopilot' || github.ref == 'refs/heads/zoro-gen7-risk-correlation-guards' || github.ref == 'refs/heads/zoro-gen8-execution-integrity' || github.ref == 'refs/heads/zoro-gen9-candle-integrity' || github.ref == 'refs/heads/zoro-gen14-cognitive-market-engine' || github.ref == 'refs/heads/zoro-gen15-adaptive-consensus' || github.ref == 'refs/heads/zoro-gen16-triple-barrier-labels' || github.ref == 'refs/heads/zoro-gen17-wilder-indicators' || github.ref == 'refs/heads/zoro-gen18-regime-specialist-audit' || github.ref == 'refs/heads/zoro-gen19-regime-calibration'))) }}
        run: |
          set -euo pipefail
          gzip -1 -f app/src/main/assets/market_seed.csv
      - name: Publish verified XT-only training bundle
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.train_models) || (github.event_name == 'push' && (github.ref == 'refs/heads/zoro-gen2-neural-calibration' || github.ref == 'refs/heads/zoro-gen3-walkforward-research' || github.ref == 'refs/heads/zoro-gen3-refinement' || github.ref == 'refs/heads/zoro-gen4-validation' || github.ref == 'refs/heads/zoro-gen4-validation-audit' || github.ref == 'refs/heads/zoro-gen4-holdout-hardening' || github.ref == 'refs/heads/zoro-gen4-signal-consensus' || github.ref == 'refs/heads/zoro-gen4-crypto-identity' || github.ref == 'refs/heads/zoro-gen4-neural-probability-labels' || github.ref == 'refs/heads/zoro-gen5-training-efficiency' || github.ref == 'refs/heads/zoro-gen6-dynamic-autopilot' || github.ref == 'refs/heads/zoro-gen7-risk-correlation-guards' || github.ref == 'refs/heads/zoro-gen8-execution-integrity' || github.ref == 'refs/heads/zoro-gen9-candle-integrity' || github.ref == 'refs/heads/zoro-gen14-cognitive-market-engine' || github.ref == 'refs/heads/zoro-gen15-adaptive-consensus' || github.ref == 'refs/heads/zoro-gen16-triple-barrier-labels' || github.ref == 'refs/heads/zoro-gen17-wilder-indicators' || github.ref == 'refs/heads/zoro-gen18-regime-specialist-audit' || github.ref == 'refs/heads/zoro-gen19-regime-calibration'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: ZORO-745K-XT-TRAINING-DATA
          path: |
            app/src/main/assets/market_seed.csv.gz
            app/src/main/assets/wolf_corpus_manifest.json
            app/src/main/assets/wolf_model_training_report.json
            app/src/main/assets/wolf_pretrained_ensemble.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce complete offline AI bundle for release builds
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_trained_bundle) || (github.event_name == 'push' && (github.ref == 'refs/heads/zoro-gen2-neural-calibration' || github.ref == 'refs/heads/zoro-gen3-walkforward-research' || github.ref == 'refs/heads/zoro-gen3-refinement' || github.ref == 'refs/heads/zoro-gen4-validation' || github.ref == 'refs/heads/zoro-gen4-validation-audit' || github.ref == 'refs/heads/zoro-gen4-holdout-hardening' || github.ref == 'refs/heads/zoro-gen4-signal-consensus' || github.ref == 'refs/heads/zoro-gen4-crypto-identity' || github.ref == 'refs/heads/zoro-gen4-neural-probability-labels' || github.ref == 'refs/heads/zoro-gen5-training-efficiency' || github.ref == 'refs/heads/zoro-gen6-dynamic-autopilot' || github.ref == 'refs/heads/zoro-gen7-risk-correlation-guards' || github.ref == 'refs/heads/zoro-gen8-execution-integrity' || github.ref == 'refs/heads/zoro-gen9-candle-integrity' || github.ref == 'refs/heads/zoro-gen14-cognitive-market-engine' || github.ref == 'refs/heads/zoro-gen15-adaptive-consensus' || github.ref == 'refs/heads/zoro-gen16-triple-barrier-labels' || github.ref == 'refs/heads/zoro-gen17-wilder-indicators' || github.ref == 'refs/heads/zoro-gen18-regime-specialist-audit' || github.ref == 'refs/heads/zoro-gen19-regime-calibration')) }}
        run: |
          set -euo pipefail
          ASSETS=app/src/main/assets
          test -s "$ASSETS/market_seed.csv.gz"
          test -s "$ASSETS/wolf_corpus_manifest.json"
          test -s "$ASSETS/wolf_pretrained_ensemble.json"
          test -s "$ASSETS/wolf_model_training_report.json"
          python - <<'PY'
          import gzip, json, pathlib
          p=pathlib.Path("app/src/main/assets")
          m=json.loads((p/"wolf_corpus_manifest.json").read_text())
          model=json.loads((p/"wolf_pretrained_ensemble.json").read_text())
          report=json.loads((p/"wolf_model_training_report.json").read_text())
          assert m.get("status")=="verified_real_exchange_data"
          assert m.get("rows",0)>=898_920 and m.get("synthetic_rows") == 0
          assert m.get("data_source_policy")=="XT_USDT_M_CRYPTO_ONLY"
          assert m.get("source_exchanges")==["XT"]
          assert m.get("crypto_only_verified") is True
          assert m.get("currency_universe_source") == "XT_SPOT_PUBLIC_SUPPORTED_CURRENCIES+COINGECKO_PUBLIC_COINS_LIST"
          assert m.get("xt_crypto_type_currency_count",0) >= 1
          assert m.get("asset_class_policy")=="XT_SPOT_CRYPTO_AND_COINGECKO_IDENTITY_MATCH"
          assert len(model.get("members",[]))==10
          assert set(model.get("symbols",[])).issubset(set(m.get("crypto_symbols",[])))
          assert model.get("corpus_sha256")==m.get("sha256")
          assert model.get("currency_metadata_sha256")==m.get("currency_metadata_sha256")
          assert model.get("asset_class_policy")==m.get("asset_class_policy")
          assert model.get("crypto_asset_registry_source")==m.get("crypto_asset_registry_source")
          assert model.get("crypto_asset_registry_sha256")==m.get("crypto_asset_registry_sha256")
          assert report.get("validation_status")=="validated_for_scoring"
          with gzip.open(p/"market_seed.csv.gz","rt",encoding="utf-8") as f:
              header=f.readline().strip()
              assert header=="exchange,symbol,timeframe,timestamp,open,high,low,close,volume"
          print("Verified release bundle: XT-only one-million-candle corpus + ten validated neural specialists")
          PY
      - name: Verify mandatory offline neural bundle before every APK build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("app/src/main/assets")
          for name in ("wolf_pretrained_ensemble.json","wolf_corpus_manifest.json","wolf_model_training_report.json"):
              assert (p/name).is_file() and (p/name).stat().st_size > 100, f"Missing/empty asset: {name}"
          model=json.loads((p/"wolf_pretrained_ensemble.json").read_text())
          manifest=json.loads((p/"wolf_corpus_manifest.json").read_text())
          report=json.loads((p/"wolf_model_training_report.json").read_text())
          assert model.get("format")=="amir-wolf-ensemble-v2" and len(model.get("members",[]))==10
          assert len(model.get("metrics",[]))==10
          regime_audit=model.get("regime_diagnostics",{})
          expected_regimes={"high_volatility","low_volatility","trend_up","trend_down","range"}
          assert regime_audit.get("runtime_weighting_enabled") is False
          assert all(set(item.get("regime_breakdown",{}))==expected_regimes for item in model["metrics"])
          assert manifest.get("status")=="verified_real_exchange_data"
          assert manifest.get("data_source_policy")=="XT_USDT_M_CRYPTO_ONLY" and manifest.get("source_exchanges")==["XT"]
          assert manifest.get("asset_class_policy")=="XT_SPOT_CRYPTO_AND_COINGECKO_IDENTITY_MATCH"
          assert len(manifest.get("currency_metadata_sha256",""))==64
          assert manifest.get("crypto_asset_registry_source")=="COINGECKO_PUBLIC_COINS_LIST"
          assert len(manifest.get("crypto_asset_registry_sha256",""))==64
          assert manifest.get("crypto_only_verified") is True
          assert manifest.get("currency_universe_source") == "XT_SPOT_PUBLIC_SUPPORTED_CURRENCIES+COINGECKO_PUBLIC_COINS_LIST"
          assert manifest.get("xt_crypto_type_currency_count",0) >= 1
          assert manifest.get("asset_class_policy")=="XT_SPOT_CRYPTO_AND_COINGECKO_IDENTITY_MATCH"
          assert set(report.get("symbols",[])).issubset(set(manifest.get("crypto_symbols",[])))
          assert model.get("corpus_sha256")==manifest.get("sha256")
          assert model.get("currency_metadata_sha256")==manifest.get("currency_metadata_sha256")
          assert model.get("asset_class_policy")==manifest.get("asset_class_policy")
          assert model.get("crypto_asset_registry_source")==manifest.get("crypto_asset_registry_source")
          assert model.get("crypto_asset_registry_sha256")==manifest.get("crypto_asset_registry_sha256")
          assert manifest.get("rows",0)>=898920 and manifest.get("synthetic_rows")==0
          e=model["evaluation"]
          wf=model["walk_forward"]; cross=model["cross_symbol_holdout"]
          assert wf.get("status")=="evaluated" and wf.get("fold_count",0)>=3
          assert wf.get("mean_balanced_accuracy",0)>=0.50
          assert wf.get("mean_log_loss",999)<wf.get("mean_baseline_log_loss",0)
          assert cross.get("status")=="evaluated"
          assert cross.get("balanced_accuracy",0)>=0.50
          assert cross.get("log_loss",999)<cross.get("baseline_log_loss",0)
          assert cross.get("roc_auc",0)>=0.52
          assert e["split"]=="chronological_purged" and model.get("test_samples",0)>=300
          assert e["ensemble_balanced_accuracy"]>=0.52
          assert e["ensemble_log_loss"]<e["prevalence_baseline_log_loss"]
          assert e["ensemble_accuracy"]>=e["majority_class_baseline_accuracy"]
          assert e["ensemble_brier_score"]<e["prevalence_baseline_brier_score"]
          assert e["ensemble_roc_auc"]>=0.55 and e["ensemble_expected_calibration_error"]<=0.10
          assert set(model.get("symbols",[])).issubset(set(manifest.get("crypto_symbols",[])))
          assert model.get("corpus_sha256")==manifest.get("sha256")
          assert model.get("currency_metadata_sha256")==manifest.get("currency_metadata_sha256")
          assert model.get("crypto_asset_registry_source")==manifest.get("crypto_asset_registry_source")
          assert model.get("crypto_asset_registry_sha256")==manifest.get("crypto_asset_registry_sha256")
          print("Verified: 10 XT-trained neural specialists and chronological holdout gates.")
          PY
      - name: Verify analysis-only product has no live execution entry points
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main/java/com/cryptoaipro/monitor")
          main = (root / "MainActivity.kt").read_text(encoding="utf-8")
          service = (root / "HopeHunterMonitorService.kt").read_text(encoding="utf-8")
          commander = (root / "HopeCommanderScreen.kt").read_text(encoding="utf-8")
          engine = (root / "XtLiveTradingEngine.kt").read_text(encoding="utf-8")
          assert "XtApiCredentialPanel" not in main
          assert "XtLivePositionsPanel" not in main
          assert "XtLivePositionsPanel" not in commander
          assert "XtApiCredentialPanel" not in commander
          assert "XtLiveTradingEngine" not in main
          assert "XtLiveTradingEngine" not in service
          assert "XtCredentialVault" not in service
          assert "XtAuthenticatedFuturesClient" not in engine
          assert "openMarketWithProtection" not in engine
          assert "emergencyClose" not in engine
          assert 'putBoolean("live_execution_enabled", false)' in engine
          print("Verified: UI and background service are analysis-only; live execution coordinator is a no-op safety stub.")
          PY
      - name: Run Android unit tests for neural signal consensus
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build installable APK with diagnostic log
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          GRADLE_OPTS: "-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false"
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee build.log
      - name: Verify APK package integrity and metadata
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-metadata.txt
          grep -q "com.cryptoaipro.monitor" apk-metadata.txt
          python3 - <<'PY'
          import json, zipfile
          apk="app/build/outputs/apk/debug/app-debug.apk"
          required=("assets/wolf_pretrained_ensemble.json","assets/wolf_corpus_manifest.json","assets/wolf_model_training_report.json")
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              for name in required:
                  assert name in names, f"APK is missing {name}"
              model=json.loads(z.read(required[0]))
              manifest=json.loads(z.read(required[1]))
              assert len(model.get("members",[]))==10
              assert manifest.get("rows",0)>=898920 and manifest.get("source_exchanges")==["XT"]
          print("APK package check passed: all neural assets and 10 models are present.")
          PY
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ZORO-2.74.0-build-diagnostics
          path: |
            build.log
            apk-metadata.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORO-2.74.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
