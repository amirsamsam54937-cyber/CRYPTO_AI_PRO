name: ZORO XT Deep Learning Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wolf-deep-learning.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: zoro-xt-deep-learning-refresh
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ZORO release branch
        uses: actions/checkout@v4
        with:
          ref: release/hope-hunter-2.64-enhanced-signals
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install XT collection and training dependencies
        run: python -m pip install --upgrade pip ccxt numpy scikit-learn

      - name: Build one million real XT USDT-M candles
        run: |
          set -euo pipefail
          python tools/build_real_market_seed.py
          cp market_seed_manifest.json app/src/main/assets/wolf_corpus_manifest.json

      - name: Verify XT-only corpus provenance and row count
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, pathlib
          root=pathlib.Path("app/src/main/assets")
          m=json.loads((root/"wolf_corpus_manifest.json").read_text())
          assert m["status"]=="verified_real_exchange_data"
          assert m["data_source_policy"]=="XT_USDT_M_ONLY"
          assert m["source_exchanges"]==["XT"]
          assert m["rows"]>=1_000_000 and m["synthetic_rows"]==0
          with (root/"market_seed.csv").open(newline="") as f:
              rows=0
              for row in csv.DictReader(f):
                  assert row["exchange"].upper()=="XT"
                  rows+=1
          assert rows==m["rows"], (rows,m["rows"])
          print(f"Verified {rows:,} real XT USDT-M candles; zero synthetic rows")
          PY

      - name: Train ten independent neural specialists
        run: |
          set -euo pipefail
          python tools/train_wolf_ensemble.py 2>&1 | tee wolf-training.log
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("app/src/main/assets/wolf_pretrained_ensemble.json")
          assert p.is_file() and p.stat().st_size>10000, "Ten-model weights were not exported"
          d=json.loads(p.read_text()); e=d["evaluation"]
          assert d["format"]=="amir-wolf-ensemble-v1"
          assert len(d["members"])==10
          assert d["samples"]>=10000 and d["test_samples"]>=300
          assert e["split"]=="chronological_purged"
          assert e["target"]=="future_price_direction_up_vs_down"
          validated=(
              e["ensemble_balanced_accuracy"]>=0.52
              and e["ensemble_log_loss"]<e["prevalence_baseline_log_loss"]
              and e["ensemble_accuracy"]>=e["majority_class_baseline_accuracy"]
              and e["ensemble_brier_score"]<e["prevalence_baseline_brier_score"]
              and e["ensemble_roc_auc"]>=0.55
              and e["ensemble_expected_calibration_error"]<=0.10
          )
          report={k:v for k,v in d.items() if k!="members"}
          report["validation_status"]="validated_for_scoring" if validated else "trained_but_not_validated"
          report["validated_for_scoring"]=bool(validated)
          report_path=pathlib.Path("app/src/main/assets/wolf_model_training_report.json")
          report_path.write_text(json.dumps(report,indent=2))
          print(json.dumps({"trained_models":len(d["members"]),"samples":d["samples"],
                            "validation_status":report["validation_status"],"evaluation":e},indent=2))
          PY

      - name: Compress verified corpus
        run: |
          set -euo pipefail
          gzip -1 -f app/src/main/assets/market_seed.csv
          test -s app/src/main/assets/market_seed.csv.gz

      - name: Publish model bundle to the ZORO release branch
        run: |
          set -euo pipefail
          TARGET_BRANCH="release/hope-hunter-2.64-enhanced-signals"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/market_seed.csv.gz \
            app/src/main/assets/wolf_corpus_manifest.json \
            app/src/main/assets/wolf_pretrained_ensemble.json \
            app/src/main/assets/wolf_model_training_report.json
          if git diff --cached --quiet; then
            echo "Training bundle unchanged; no commit needed."
          else
            git commit -m "chore(ai): refresh verified XT corpus and ten-model ensemble"
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Upload training report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZORO-XT-TRAINING-REPORT
          path: |
            app/src/main/assets/wolf_model_training_report.json
            app/src/main/assets/wolf_corpus_manifest.json
            wolf-training.log
          if-no-files-found: ignore
          retention-days: 30
