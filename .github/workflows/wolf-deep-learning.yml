name: Wolf Deep Learning Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: wolf-deep-learning-refresh
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install training dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn

      - name: Train ten deep MLP specialists on canonical public data
        id: train
        shell: bash
        run: |
          set +e
          python tools/train_wolf_ensemble.py 2>&1 | tee wolf-training.log
          TRAIN_EXIT=${PIPESTATUS[0]}
          set -e
          if [ ! -f app/src/main/assets/wolf_pretrained_ensemble.json ]; then
            echo "trained=false" >> "$GITHUB_OUTPUT"
            echo "No new weights exported. This is expected when Binance returns HTTP 451 or insufficient data is available."
            exit 0
          fi
          python - <<'PY'
          import json, os, sys
          p='app/src/main/assets/wolf_pretrained_ensemble.json'
          d=json.load(open(p))
          e=d.get('evaluation',{})
          checks={
            'ten_members': len(d.get('members',[])) == 10,
            'chronological_holdout': e.get('split') == 'chronological_purged',
            'sufficient_test': d.get('test_samples',0) >= 300,
            'balanced_accuracy_above_coinflip': e.get('ensemble_balanced_accuracy',0) > 0.51,
            'logloss_beats_prevalence': e.get('ensemble_log_loss',999) < e.get('prevalence_baseline_log_loss',0),
          }
          print(json.dumps({'checks':checks,'evaluation':e},indent=2))
          if not all(checks.values()):
            os.remove(p)
            print('Model rejected: validation gates not met; previous app model is preserved.')
            sys.exit(0)
          open(os.environ['GITHUB_OUTPUT'],'a').write('trained=true\n')
          PY

      - name: Commit validated model weights
        if: steps.train.outputs.trained == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/wolf_pretrained_ensemble.json
          if git diff --cached --quiet; then
            echo "Validated model is unchanged; no commit needed."
          else
            git commit -m "chore(ai): refresh validated Wolf deep ensemble"
            git push origin HEAD:main
          fi

      - name: Upload training report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-deep-learning-report
          path: |
            wolf_model_training_report.json
            wolf-training.log
          if-no-files-found: ignore
          retention-days: 30
