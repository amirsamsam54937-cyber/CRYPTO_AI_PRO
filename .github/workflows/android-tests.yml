name: Android unit tests
on:
  push:
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-tests.yml"
  pull_request:
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-tests.yml"
permissions:
  contents: read
concurrency:
  group: zoro-android-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
